<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 가게 메뉴 이익 계산기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1f2328;--sub:#5b6470;--line:#e3e7ec;--soft:#f5f7f9;--navy:#1B3A5C;--coral:#E06B55;--sage:#5E9A78;--sage-l:#E3F0E7;--coral-l:#FBE3DC}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.45rem;margin:0 0 4px}
.sub{color:var(--sub);font-size:.92rem;margin:0 0 14px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.tile{border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;box-shadow:5px 5px 0 #CFD8E2}
.tile .l{font-size:.8rem;color:var(--sub)} .tile .v{font-size:1.4rem;font-weight:800}
.tile.good{background:var(--sage-l)} .tile.warn{background:var(--coral-l)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{background:var(--soft);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--sub)}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
input{width:100%;font:inherit;font-size:1rem;padding:8px;border:1px solid var(--line);border-radius:8px}
input.num{text-align:right}
td.r{text-align:right;font-weight:700;white-space:nowrap}
.bad{color:var(--coral)} .ok{color:var(--sage)}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;margin-top:12px;cursor:pointer;background:var(--navy);color:#fff;font-size:1rem}
button.del{background:none;color:var(--sub);padding:4px 8px;margin:0;font-weight:500}
.tbl{overflow-x:auto}
.note{font-size:.82rem;color:var(--sub);margin-top:10px}
@media (max-width:600px){.sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>우리 가게 메뉴 이익 계산기</h1>
  <p class="sub">메뉴 이름, 판매가, 1개당 원가, 하루 판매량을 넣으면 메뉴별 이익과 원가율, 하루 총이익을 바로 계산합니다.</p>
  <div class="sum">
    <div class="tile"><div class="l">하루 매출</div><div class="v" id="sRev">0원</div></div>
    <div class="tile good"><div class="l">하루 총이익(재료비만 뺀 돈)</div><div class="v" id="sProfit">0원</div></div>
    <div class="tile warn"><div class="l">전체 원가율</div><div class="v" id="sRate">0%</div></div>
  </div>
  <div class="tbl"><table>
    <thead><tr><th style="width:30%">메뉴</th><th>판매가</th><th>1개당 원가</th><th>하루 판매</th><th>1개당 이익</th><th>원가율</th><th>하루 이익</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <button type="button" id="add">메뉴 한 줄 더하기</button>
  <p class="note">원가율 50% 이상은 빨간색으로 표시합니다. 월세·인건비 같은 고정비는 빠진 계산입니다. 예시 숫자는 가상 부대찌개집 자료입니다.</p>
</div>
<script>
var data=[["부대찌개 1인분",8000,4600,87],["라면사리",1500,350,47],["치즈사리",2000,700,20],["햄 추가",4000,2300,12],["콜라·사이다",2000,800,23]];
var tb=document.getElementById('rows');
function won(n){return Math.round(n).toLocaleString('ko-KR')+'원'}
function row(d){var tr=document.createElement('tr');
 tr.innerHTML='<td><input value="'+d[0]+'"></td><td><input class="num" type="number" inputmode="numeric" value="'+d[1]+'"></td><td><input class="num" type="number" inputmode="numeric" value="'+d[2]+'"></td><td><input class="num" type="number" inputmode="numeric" value="'+d[3]+'"></td><td class="r"></td><td class="r"></td><td class="r"></td><td><button type="button" class="del" aria-label="삭제">삭제</button></td>';
 tr.querySelectorAll('input').forEach(function(i){i.addEventListener('input',calc)});
 tr.querySelector('.del').addEventListener('click',function(){tr.remove();calc()});
 tb.appendChild(tr)}
function calc(){var rev=0,cost=0,pf=0;
 tb.querySelectorAll('tr').forEach(function(tr){var v=tr.querySelectorAll('input');var p=+v[1].value||0,c=+v[2].value||0,n=+v[3].value||0;var td=tr.querySelectorAll('td.r');
  var u=p-c, rate=p?c/p*100:0; td[0].textContent=won(u); td[1].textContent=rate.toFixed(1)+'%'; td[1].className='r '+(rate>=50?'bad':'ok'); td[2].textContent=won(u*n);
  rev+=p*n; cost+=c*n; pf+=u*n});
 document.getElementById('sRev').textContent=won(rev);document.getElementById('sProfit').textContent=won(pf);document.getElementById('sRate').textContent=(rev?cost/rev*100:0).toFixed(1)+'%'}
data.forEach(row);calc();
document.getElementById('add').addEventListener('click',function(){row(["새 메뉴",0,0,0]);calc()});
</script>
</body>
</html>
